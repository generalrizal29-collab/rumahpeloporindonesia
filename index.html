// ===== KONFIGURASI SUPABASE: isi di sini, atau biarkan kosong lalu isi lewat layar setup pertama =====
const SUPABASE_URL="https://fgzllccotccxogncpsgs.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_nzb3wHiuXwWJksFaYkoOrw_Bq8pVVmz";
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return ''}};
const CU=SUPABASE_URL||ls('rpi_u')||'', CK=SUPABASE_ANON_KEY||ls('rpi_k')||'';

// ===== TEMA TERANG/GELAP (ikut sistem, bisa diganti manual dengan tombol) =====
const curTheme=()=>document.documentElement.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

const compressImg=(file,maxW=1280,q=0.72)=>new Promise((res,rej)=>{
  if(!/^image\//.test(file.type))return rej(new Error('File harus berupa gambar'));
  if(file.size>25*1024*1024)return rej(new Error('Ukuran gambar terlalu besar (maks. 25 MB)'));
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const s=Math.min(1,maxW/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('Gagal mengompres gambar')),'image/jpeg',q);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Gambar tidak bisa dibaca. Coba screenshot ulang bukti transfer.'));};
  img.src=url;
});

// Kuitansi digambar langsung ke canvas lalu diunduh sebagai JPG (tanpa library tambahan; logo dilewati bila server logo menolak CORS)
async function dlKuitansi(v,lem){
  const W=720,H=640,S=2,c=document.createElement('canvas');c.width=W*S;c.height=H*S;
  const g=c.getContext('2d');g.scale(S,S);g.fillStyle='#ffffff';g.fillRect(0,0,W,H);
  const F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const txt=(t,x,y,font,col,al)=>{g.font=font;g.fillStyle=col;g.textAlign=al||'left';g.fillText(String(t==null?'':t),x,y);};
  const fit=(t,max,font)=>{g.font=font;t=String(t==null?'':t);if(g.measureText(t).width<=max)return t;while(t.length>1&&g.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…';};
  let logo=null;
  if(lem&&lem.logo_url)logo=await new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=lem.logo_url;});
  let y=40;
  if(logo){const h=60,w=Math.min(220,logo.width*h/logo.height);g.drawImage(logo,W/2-w/2,y,w,h);}
  else txt('RPI',W/2,y+46,'800 44px '+F,'#1d4ed8','center');
  y+=84;txt(fit(lem&&lem.nama||'Rumah Pelopor Indonesia',W-80,'500 20px '+F),W/2,y,'500 20px '+F,'#334155','center');
  y+=34;txt('KUITANSI DIGITAL',W/2,y,'800 26px '+F,'#0f172a','center');
  y+=16;g.fillStyle='#1d4ed8';g.fillRect(40,y,W-80,3);y+=14;
  const rows=[['No.',v.no_kuitansi||'-'],['Tanggal',tgl(v)],['Donatur',v.donatur_nama],['Kategori',v.kategori&&v.kategori.nama],['Metode',v.metode],['Relawan',v.relawan&&v.relawan.nama]];
  rows.forEach(([l,val])=>{y+=46;txt(l,48,y,'500 18px '+F,'#64748b');txt(fit(val||'-',W-250,'700 19px '+F),200,y,'700 19px '+F,'#0f172a');g.fillStyle='#e2e8f0';g.fillRect(40,y+14,W-80,1);});
  y+=78;txt(Rp(v.nominal),W/2,y,'800 40px '+F,'#1d4ed8','center');
  y+=50;txt('Jazakumullahu khairan. Semoga menjadi amal jariyah.',W/2,y,'italic 500 16px '+F,'#475569','center');
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
  if(!blob)throw new Error('Gagal membuat gambar');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='kuitansi-'+String(v.no_kuitansi||'RPI').replace(/[^\w-]+/g,'-')+'.jpg';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

function Form({me,d,reload,done,pre}){

  const [f,setF]=useState({...init,did:pre||''}),[busy,setBusy]=useState(false);
  const u=(k,v)=>setF(s=>({...s,[k]:v}));const ok=f.status==='Berhasil';
  const save=async()=>{
    let did=f.did,nama=f.nama.trim();if(did)nama=d.don.find(x=>x.id===did).nama;
    if(!nama)return alert('Pilih atau isi nama donatur');
    if(ok){if(!(+f.nominal>0))return alert('Nominal wajib diisi');if(!f.kat)return alert('Pilih kategori');if(f.metode!=='Cash'&&!f.file)return alert('Upload bukti pembayaran');}
    setBusy(true);
    try{
      if(!did){const r=await sb.from('donatur').insert({nama,no_hp:f.hp||null}).select().single();if(r.error)throw r.error;did=r.data.id;}
      let path=null;
      if(ok&&f.metode!=='Cash'&&f.file){const blob=await compressImg(f.file);path=me.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.jpg';const r=await sb.storage.from('bukti').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;}
      const r=await sb.from('kunjungan').insert({donatur_id:did,donatur_nama:nama,status:f.status,catatan:f.cat||null,nominal:ok?+f.nominal:0,kategori_id:ok?+f.kat:null,metode:ok?f.metode:null,bukti_path:ok?path:null});
      if(r.error)throw r.error;
      setF(init);reload();done();
    }catch(e){err(e);}
    setBusy(false);
  };
  return html`<div><div class="card"><b>Lapor Kunjungan Baru</b><div class="mut">Isi data kunjungan Anda.</div>
  <label>Donatur</label><select value=${f.did} onChange=${e=>u('did',e.target.value)}><option value="">+ Donatur baru</option>${d.don.map(x=>html`<option key=${x.id} value=${x.id}>${x.nama}</option>`)}</select>

// ===== REKAP TIM (owner): rekap per koordinator + tracking relawan sudah/belum bergerak =====
// Data dari fungsi database rekap_relawan(dari, sampai) -> agregasi dihitung di server (WIB), bukan dari 3000 baris di browser.
const hariWIB=()=>tgl({created_at:new Date().toISOString()});

function App(){
  const [sess,setSess]=useState(undefined),[me,setMe]=useState(undefined);
  useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>setSess(data.session));const {data}=sb.auth.onAuthStateChange((_e,s)=>setSess(s));return()=>data.subscription.unsubscribe();},[]);

  if(sess===undefined)return Spin('Memuat...');
  if(!sess)return html`<${Login}/>`;
  if(me===undefined)return Spin('Memuat profil...');
  if(!me||!me.aktif)return html`<div class="center card"><b>Akun belum aktif</b><p>Profil belum dibuat atau akun dinonaktifkan. Hubungi Owner.</p><button class="btn o" onClick=${out}>Keluar</button></div>`;
  return html`<${Main} me=${me} out=${out}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
